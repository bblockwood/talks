<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' blob: data:; font-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'"
    />
    <meta name="robots" content="noindex" />
    <title>Lectern presenter</title>
    <link rel="stylesheet" href="/src/room/presenter.css" />
  </head>
  <body>
    <div id="waiting" class="waiting">Waiting for the slides… This window is opened by Lectern when a talk starts in two-screen mode.</div>

    <div id="app" class="presenter" hidden>
      <main class="panes">
        <section class="left">
          <div id="current" class="slide"></div>
          <div class="under">
            <button id="laser" title="Laser pointer (L)">Laser</button>
            <button id="swap" title="Swap displays (Ctrl+D, or Cmd+D on a Mac)">Swap displays</button>
            <span id="digits" class="digits"></span>
            <span class="spacer"></span>
            <button id="back" hidden></button>
            <button id="forward" hidden></button>
          </div>
        </section>

        <div id="divider" class="divider" title="Drag to resize"></div>

        <section class="right">
          <div class="righthead">
            <span id="right-title">Next</span>
            <button id="overview-toggle" title="Overview (Tab)">Overview</button>
          </div>

          <div id="normal" class="normal">
            <div id="next" class="slide"></div>
            <div class="noteshead">
              <span>Notes</span>
              <span>
                <button id="notes-smaller" aria-label="Smaller notes">A−</button>
                <button id="notes-larger" aria-label="Larger notes">A+</button>
              </span>
            </div>
            <div id="notes" class="notes"></div>
            <div id="notes-image" class="slide notes-image" hidden></div>
          </div>

          <div id="overview" class="overview" hidden>
            <input id="search" type="search" placeholder="Search slides" autocomplete="off" spellcheck="false" />
            <div id="results" class="results" hidden></div>
            <div id="grid" class="grid"></div>
          </div>
        </section>
      </main>

      <footer class="status">
        <span id="where" class="where"></span>
        <span id="pill" class="pill" hidden></span>
        <span id="relay" class="relay"></span>
        <span class="spacer"></span>
        <button id="clock" class="clock" title="Pause or resume the clock (T)">0:00</button>
        <button id="clock-reset" title="Reset the clock">Reset</button>
        <span id="wall" class="wall"></span>
        <span class="hint">Esc twice to end</span>
      </footer>

      <pre id="debug" class="debug" hidden></pre>
    </div>
    <script type="module" src="/src/room/presenter.ts"></script>
  </body>
</html>
