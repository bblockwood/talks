<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' __RELAY_ORIGIN__; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'"
    />
    <meta name="robots" content="noindex" />
    <title>Lectern W0: phone test</title>
    <link rel="stylesheet" href="/src/w0/w0.css" />
  </head>
  <body>
    <main class="page phone">
      <h1>Lectern W0: phone</h1>

      <section id="pair">
        <label for="digits">Number shown on the room PC</label>
        <input id="digits" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000" />
        <button id="connect" class="primary">Connect</button>
      </section>

      <section id="live" hidden>
        <dl class="results">
          <dt>Relay</dt>
          <dd id="p-relay">…</dd>
          <dt>Room PC</dt>
          <dd id="p-room">not seen yet</dd>
          <dt>Round trip</dt>
          <dd id="p-rtt">–</dd>
          <dt>Slide</dt>
          <dd id="p-slide">–</dd>
          <dt>Wake lock</dt>
          <dd id="p-wakelock">not tried</dd>
        </dl>
        <div class="navbuttons">
          <button id="prev">Prev</button>
          <button id="next" class="primary">Next</button>
        </div>
        <p><button id="reset-rtt">Reset round-trip numbers</button></p>

        <h2>Report from the room PC</h2>
        <p id="p-report-status" class="muted">Nothing received yet. On the room PC, click “Send report to phone”.</p>
        <p>
          <button id="p-copy" disabled>Copy</button>
          <button id="p-share" disabled>Share…</button>
          <span id="p-copied" class="muted"></span>
        </p>
        <pre id="p-report" class="log tall"></pre>
      </section>
    </main>
    <script type="module" src="/src/w0/phone.ts"></script>
  </body>
</html>
